[project]
name = "executive-board-council"
version = "0.1.0"
description = "German Production Company Executive Board Council - Multi-LLM Decision Support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "supabase>=2.0.0",
    "slowapi>=0.1.9",
    "python-jose[cryptography]>=3.3.0",
    "stripe>=7.0.0",
    "email-validator>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
